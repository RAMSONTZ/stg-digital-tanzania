<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STG Digital · Clinical Learning Library</title><style>body{background:#f9fbf9;color:#263d31;font:14px system-ui;margin:0;padding:12vh 22px;text-align:center}.spinner{height:24px;width:24px;border:3px solid #ddebe2;border-top-color:#1e6446;border-radius:50%;margin:25px auto;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.link{color:#145e41}small{color:#5e7669}main{max-width:520px;margin:auto}</style></head><body><main role="status" aria-live="polite"><h1>Clinical learning library</h1><p id="status">Loading the complete offline learning material…</p><div class="spinner" id="loading"></div><small>Source: the original user-uploaded clinical learning library. Educational use only; not a prescribing system.</small><p><a class="link" href="/overview.html">Return to STG Digital</a></p></main><script>(async()=>{const n=25;try{const responses=await Promise.all(Array.from({length:n},(_,i)=>fetch('/learning/clinical-parts/part-'+String(i).padStart(3,'0')+'.txt',{cache:'force-cache'})));const err=responses.findIndex(r=>!r.ok);if(err!==-1)throw Error('Module part '+(err+1)+' could not load ('+responses[err].status+')');const parts=await Promise.all(responses.map(r=>r.text()));const doc=parts.join('');if(!doc.includes('Learn — HPI & Doctor Summary')||!doc.includes('</html>')||doc.length<4500000)throw Error('Incomplete clinical learning archive');document.open();document.write(doc);document.close()}catch(err){document.getElementById('loading').style.display='none';document.getElementById('status').textContent='The learning library could not load: '+err.message;}})();</script></body></html>
